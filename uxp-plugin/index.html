<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MCP Transcript Bridge</title>
  <style>
    body { margin: 0; padding: 16px; background: #252525; color: #f5f5f5; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    h1 { margin: 0 0 6px; font-size: 18px; } p { color: #bbb; line-height: 1.4; }
    .card { margin: 12px 0; padding: 12px; border-radius: 6px; background: #333; }
    .label { color: #aaa; font-size: 11px; text-transform: uppercase; } #bridgeRoot { box-sizing: border-box; width: 100%; margin-top: 5px; padding: 8px; border: 1px solid #555; border-radius: 4px; color: #f5f5f5; background: #1d1d1d; }
    button { margin: 8px 6px 0 0; border: 0; border-radius: 4px; padding: 8px 10px; color: white; background: #1473e6; cursor: pointer; } button:disabled { cursor: default; opacity: .45; }
    #log { max-height: 170px; overflow-y: auto; border-radius: 4px; padding: 8px; background: #1d1d1d; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    #log div { margin: 3px 0; } .warning { color: #f8c555; } .error { color: #ff7777; } .ok { color: #5fd38d; } .muted { color: #aaa; }
  </style>
</head>
<body>
  <h1>MCP Transcript Bridge</h1>
  <p>Reads Premiere Speech-to-Text source transcripts for the MCP server. This does not replace the CEP editing bridge.</p>
  <div class="card"><div class="label">Premiere runtime</div><div id="hostInfo">Checking…</div></div>
  <div class="card"><div class="label">Bridge root</div><input id="bridgeRoot" type="text" value="/tmp/premiere-mcp-bridge" spellcheck="false"><button id="save">Save bridge root</button></div>
  <div class="card"><div class="label">Status</div><div id="status" class="muted">Stopped</div><button id="start" disabled>Start Bridge</button><button id="stop" disabled>Stop Bridge</button></div>
  <div class="card"><div class="label">Activity</div><div id="log"></div></div>
  <script src="bridge.js"></script>
</body>
</html>
