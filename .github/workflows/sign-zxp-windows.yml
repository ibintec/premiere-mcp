name: Sign CEP ZXP for Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to receive the Windows-signed ZXP
        required: true

permissions:
  contents: write

jobs:
  sign:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore signing certificate
        shell: powershell
        env:
          ZXP_CERT_BASE64: ${{ secrets.ZXP_CERT_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ZXP_CERT_BASE64)) {
            throw 'Configure the ZXP_CERT_BASE64 repository secret first.'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'premiere-mcp.p12'
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:ZXP_CERT_BASE64)
          )

      - name: Download Adobe ZXPSignCmd
        shell: powershell
        run: |
          $signerPath = Join-Path $env:RUNNER_TEMP 'ZXPSignCmd.exe'
          Invoke-WebRequest `
            -Uri 'https://raw.githubusercontent.com/Adobe-CEP/CEP-Resources/master/ZXPSignCMD/4.1.3/x64/ZXPSignCmd.exe' `
            -OutFile $signerPath

      - name: Sign and verify Windows CEP archive
        shell: powershell
        env:
          ZXP_SIGN_CMD: ${{ runner.temp }}\ZXPSignCmd.exe
          ZXP_CERT_PATH: ${{ runner.temp }}\premiere-mcp.p12
          ZXP_CERT_PASSWORD: ${{ secrets.ZXP_CERT_PASSWORD }}
          ZXP_TIMESTAMP_URL: http://timestamp.digicert.com/
          ZXP_OUTPUT_PATH: ${{ github.workspace }}\MCPBridgeCEP-${{ inputs.tag }}-windows-signed.zxp
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ZXP_CERT_PASSWORD)) {
            throw 'Configure the ZXP_CERT_PASSWORD repository secret first.'
          }
          node scripts/sign-zxp.mjs

      - name: Upload Windows-signed CEP archive
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload `
            '${{ inputs.tag }}' `
            'MCPBridgeCEP-${{ inputs.tag }}-windows-signed.zxp' `
            --clobber
